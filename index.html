<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนใบคะแนน</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 15px; background-color: #f4f4f9; }
    video { width: 100%; max-width: 400px; border: 3px solid #333; border-radius: 8px; background: #000; }
    button { padding: 12px 24px; font-size: 16px; margin: 10px 5px; cursor: pointer; border: none; border-radius: 5px; color: white; }
    .btn-scan { background-color: #007bff; }
    .btn-save { background-color: #28a745; }
    .btn-retry { background-color: #dc3545; }
    #preview { display: none; margin-top: 15px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    .absent { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <h2>📷 สแกนใบบันทึกคะแนน</h2>
  
  <!-- กล้องวิดีโอ -->
  <video id="camera" autoplay playsinline></video>
  <br>
  <button class="btn-scan" onclick="scanSheet()">📸 ถ่ายภาพและอ่านคะแนน</button>
  <p id="status" style="color: #666;"></p>

  <!-- พื้นที่ซ่อนสำหรับประมวลผลภาพ -->
  <canvas id="canvas" style="display:none;"></canvas>

  <!-- พื้นที่แสดงผลลัพธ์ก่อนบันทึก -->
  <div id="preview">
    <h3>ตรวจสอบข้อมูลก่อนบันทึก</h3>
    <p><strong>การทดลอง:</strong> <span id="labName" style="color:blue;"></span></p>
    <table>
      <thead>
        <tr><th>รหัสนักศึกษา</th><th>คะแนนที่ได้</th></tr>
      </thead>
      <tbody id="scoreTable"></tbody>
    </table>
    <br>
    <button class="btn-save" onclick="saveToSheet()">✅ ยืนยันบันทึกลง Sheet</button>
    <button class="btn-retry" onclick="resetScan()">🔄 สแกนใหม่</button>
  </div>

  <script>
    // ================= ตั้งค่าตัวแปรสำคัญตรงนี้ =================
    const GEMINI_API_KEY = "AQ.Ab8RN6J0HsOyTFMU1pazQHwavqX6HEeJIJeLuzuYgjdHvYxddw"; 
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzpsXCIhcS22W1b3XlTzQy6bKveLXf6sZCb19gXA_W-ROdElsVKRcOMBmKfeoH3uKH0/exec";
    // ========================================================

    const video = document.getElementById('camera');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');
    let scannedData = null;

        // 1. เปิดกล้องมือถือ (ใช้กล้องหลัง)
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { alert("ไม่สามารถเปิดกล้องได้: " + err); });

    // 2. ฟังก์ชันถ่ายภาพและส่งให้ AI อ่าน (ปรับปรุงใหม่)
    async function scanSheet() {
      statusText.innerText = "⏳ กำลังอ่านข้อมูลจากใบคะแนน รอสักครู่...";
      
      try {
        // เช็กว่ากล้องพร้อมหรือยัง
        if (!video.videoWidth) {
          throw new Error("กล้องยังไม่พร้อมทำงาน กรุณารอสักครู่แล้วกดใหม่");
        }

        // [แก้ไข 1] ย่อขนาดภาพลงให้กว้างไม่เกิน 800px (ช่วยให้ส่งไวขึ้นมากและไม่พัง)
        const MAX_WIDTH = 800;
        const scale = MAX_WIDTH / video.videoWidth;
        canvas.width = MAX_WIDTH;
        canvas.height = video.videoHeight * scale;
        
        // วาดภาพที่ย่อแล้วลง Canvas
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // แปลงภาพเป็น Base64 (บีบอัดคุณภาพเหลือ 70%)
        const base64Image = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

        const prompt = `
          อ่านข้อมูลจากใบบันทึกคะแนนนี้ และตอบกลับมาเป็น JSON เท่านั้น โครงสร้างดังนี้:
          {
            "lab": "ชื่อการทดลองที่อยู่หัวกระดาษ (เช่น Lab 1)",
            "students": [
              {"id": "รหัสนักศึกษา", "score": คะแนน}
            ]
          }
          กฎการอ่านคะแนน:
          1. คะแนนจะมีตัวเลือก 0, 2, 4, 6, 8, 10 ช่องไหนถูกฝนทึบสีดำ ให้เอาตัวเลขนั้นเป็นคะแนน (เป็นตัวเลข Number)
          2. หากแถวของนักศึกษาคนใด "ไม่มีการฝนทึบเลย" หรือ "ถูกฝนทึบที่ช่องคำว่า ขาด" ให้ใส่ค่า score เป็นข้อความว่า "ขาดสอบ"
        `;

        // ส่งข้อมูลไปให้ Gemini (ตัดช่องว่างหน้า-หลัง API Key ออกให้ด้วยเผื่อก๊อปปี้ติดมา)
        const cleanApiKey = GEMINI_API_KEY.trim();
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${cleanApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const result = await response.json();

        // เช็กว่า API Key ผิด หรือมีปัญหาจากฝั่ง Google หรือไม่
        if (!response.ok) {
          throw new Error(result.error?.message || "เชื่อมต่อ AI ไม่สำเร็จ");
        }

        // ดึงข้อความที่ AI ตอบกลับมา
        let jsonText = result.candidates[0].content.parts[0].text;
        
        // [แก้ไข 2] ล้างเครื่องหมาย ```json ที่อาจจะติดมาออกก่อนแปลงค่า
        jsonText = jsonText.replace(/```json/g, "").replace(/```/g, "").trim();
        
        scannedData = JSON.parse(jsonText);

        // แสดงผลลัพธ์ให้คนตรวจเช็กก่อน
        showPreview(scannedData);
        statusText.innerText = "";

      } catch (error) {
        // แสดงสาเหตุที่แท้จริงออกมาบนหน้าจอเลย จะได้รู้ว่าติดตรงไหน
        statusText.innerText = "❌ ผิดพลาด: " + error.message;
        console.error(error);
      }
    }

    // 3. แสดงตารางสรุปผลบนหน้าจอมือถือ
    function showPreview(data) {
      document.getElementById('labName').innerText = data.lab || "ไม่ระบุ";
      const tbody = document.getElementById('scoreTable');
      tbody.innerHTML = "";

      if (data.students && Array.isArray(data.students)) {
        data.students.forEach(st => {
          const isAbsent = st.score === "ขาดสอบ";
          const row = `<tr>
            <td>${st.id}</td>
            <td class="${isAbsent ? 'absent' : ''}">${st.score}</td>
          </tr>`;
          tbody.innerHTML += row;
        });
      }

      video.style.display = "none";
      document.querySelector('.btn-scan').style.display = "none";
      document.getElementById('preview').style.display = "block";
    }

    // 4. ส่งข้อมูลเข้า Google Sheet
    function saveToSheet() {
      statusText.innerText = "⏳ กำลังบันทึกลง Google Sheet...";
      
      fetch(GOOGLE_SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        // [แก้ไข 3] ต้องใช้ text/plain เพื่อไม่ให้เบราว์เซอร์บล็อกตอนใช้โหมด no-cors
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
        body: JSON.stringify(scannedData)
      }).then(() => {
        alert("✅ บันทึกข้อมูลเรียบร้อยแล้ว!");
        resetScan();
      }).catch(err => {
        alert("เกิดข้อผิดพลาดในการบันทึก: " + err);
        statusText.innerText = "";
      });
    }

    // 5. รีเซ็ตหน้าจอเพื่อสแกนแผ่นต่อไป
    function resetScan() {
      video.style.display = "inline-block";
      document.querySelector('.btn-scan').style.display = "inline-block";
      document.getElementById('preview').style.display = "none";
      statusText.innerText = "";
      scannedData = null;
    }
  </script>
</body>
</html>
